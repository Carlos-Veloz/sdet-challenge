name: E2E API Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  # One independent job per environment. They run in parallel and each one gets
  # its own API container, so a failing environment never blocks the other.
  e2e:
    name: E2E - ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # a failure in `prod` must not cancel `dev` (and vice versa)
      matrix:
        environment: [dev, prod]
    services:
      api:
        image: ghcr.io/danielsilva-loanpro/sdet-interview-challenge:latest
        ports:
          - 3000:3000
    env:
      BASE_URL: http://localhost:3000
      AUTH_TOKEN: mysecrettoken
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci # API tests use Playwright's request context: no browsers needed

      - name: Wait for the API to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "$BASE_URL/${{ matrix.environment }}/users" > /dev/null; then
              echo "API is up"; exit 0
            fi
            echo "Waiting for API ($i/30)..."; sleep 2
          done
          echo "API did not start in time"; exit 1

      - name: Run E2E tests (${{ matrix.environment }})
        run: npx playwright test --project=${{ matrix.environment }}

      - name: Build failure summary
        if: always()
        run: |
          npm run failures || true
          if [ -f reports/failures-summary.md ]; then
            cat reports/failures-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.environment }}
          path: |
            playwright-report/
            reports/
          if-no-files-found: warn
          retention-days: 30
